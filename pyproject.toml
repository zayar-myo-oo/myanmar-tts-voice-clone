[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "myanmar-voice-studio"
version = "0.0.1"
description = "Offline-first Myanmar voice studio: phased development"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.10,<3", "soundfile>=0.13,<0.14", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
inference = ["transformers==4.57.1", "huggingface-hub==0.36.0", "safetensors==0.6.2"]
# Phase 3 engine: Nara Mini v1 adapter (CPU ONNX). Versions match the upstream Space.
mcp = ["mcp>=1.20,<2"]
# Phase 7 ASR (needs torch/torchaudio; use the CUDA env .venv-f5)
asr = ["torch>=2.0", "torchaudio>=2.0"]
nara = ["onnxruntime>=1.23.2", "misaki==0.9.4", "phonemizer-fork==3.3.2", "espeakng-loader==0.2.4",
        "torch>=2.0", "torchaudio>=2.0", "vocos==0.1.0"]  # vocos: whine-free re-synthesis (MIT)

[project.scripts]
mvs-doctor = "myanmar_voice_studio.doctor:main"
mvs-speak = "myanmar_voice_studio.engine.cli:main"
mvs-mcp = "myanmar_voice_studio.mcp_server.server:main"
mvs-worker = "myanmar_voice_studio.worker.worker:main"
mvs-dataset = "myanmar_voice_studio.training.dataset:main"
mvs-asr = "myanmar_voice_studio.training.asr:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
