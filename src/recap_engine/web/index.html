<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drama Recap Studio</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#ecece9">
<style>
:root{--bg:#eef4fc;--side:#f7faff;--card:#fff;--line:#dfe6f1;--fg:#141a26;--mut:#6a7487;--acc:#1565d8;--acc2:#e9f1fd;--ok:#1f9d55;--warn:#c27c0e;--err:#d23c3c;--stage:#dde7f3}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1118;--side:#121823;--card:#161d2a;--line:#253043;--fg:#e8edf6;--mut:#8d98ad;--acc:#4f8ff7;--acc2:#1b2a44;--stage:#0f151f}}
:root[data-theme=dark]{--bg:#0d1118;--side:#121823;--card:#161d2a;--line:#253043;--fg:#e8edf6;--mut:#8d98ad;--acc:#4f8ff7;--acc2:#1b2a44;--stage:#0f151f}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 "Noto Sans Myanmar","Myanmar Text","Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}.logo b{display:block;font-size:16px}.logo small{color:var(--mut);font-size:11px}
.logo i{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700}
nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;color:var(--fg);text-decoration:none}nav a.on{background:var(--acc2);color:var(--acc);font-weight:600}nav a:hover{background:var(--acc2)}
.sp{flex:1}.foot{font-size:12px;color:var(--mut);padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-right:6px}.foot .dot.on{background:var(--ok)}
main{overflow:auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px}.top h1{font-size:19px;margin:0}.top .sub{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.pill{font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px}.pill.acc{color:var(--acc);border-color:var(--acc)}
.btn{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--acc2);color:var(--acc)}.btn.line{background:transparent;border:1px solid var(--line);color:var(--fg)}.btn.red{background:transparent;border:1px solid var(--err);color:var(--err)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.studio{display:grid;grid-template-columns:1fr 360px;gap:16px;padding:0 22px 22px;flex:1;min-height:0}
@media(max-width:1100px){.studio{grid-template-columns:1fr}.app{grid-template-columns:1fr}aside{display:none}}
.stagewrap{display:flex;flex-direction:column;gap:12px;min-height:0}
.stage{flex:1;background:var(--stage);border-radius:16px;display:flex;align-items:safe center;justify-content:safe center;padding:56px 24px 24px;position:relative;min-height:420px;overflow:auto}
.vbox{position:relative;display:flex;gap:14px;align-items:center}
.vwrap{position:relative;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 10px 30px #0003}
.vwrap video{display:block;max-width:min(62vw,760px);max-height:62vh}
.ov{position:absolute;inset:0;cursor:default;touch-action:none}.ov.draw{cursor:crosshair}
.bx{position:absolute;border:2px solid #fff;border-radius:6px;background:#ffffff14;box-shadow:0 0 0 1px #0006}
.bx.sel{border-color:#4f8ff7}.bx .h{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #4f8ff7;cursor:nwse-resize}
.crop{position:absolute;border:2px dashed #ffd400;box-shadow:0 0 0 9999px #0008;pointer-events:none}
.cap{position:absolute;left:2%;right:2%;border:1.5px dashed #fff9;border-radius:30px;text-align:center;cursor:ns-resize;padding:2px 0}
.cap span{font-weight:700}
.tools{display:flex;flex-direction:column;gap:12px}.tool{display:flex;flex-direction:column;align-items:center;font-size:11px;gap:3px;color:var(--fg);cursor:pointer;background:none;border:0}
.tool b{width:40px;height:40px;border-radius:50%;background:#253043;color:#fff;display:grid;place-items:center;font-size:17px}.tool.on b{background:var(--acc)}
.bxpanel{position:absolute;transform:translateX(-50%);background:#253043;color:#fff;border-radius:99px;padding:6px 14px;display:flex;gap:8px;align-items:center;white-space:nowrap;z-index:3}
.drop{border:2px dashed var(--line);border-radius:16px;padding:46px;text-align:center;background:var(--card);max-width:560px}
.drop.hover{border-color:var(--acc);background:var(--acc2)}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;flex-wrap:wrap}.chip{background:var(--acc2);color:var(--acc);border-radius:8px;padding:2px 9px;font-size:12px}
.panel{display:flex;flex-direction:column;min-height:0;overflow:hidden}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);margin:12px;border-radius:12px;padding:4px}
.tabs button{border:0;background:none;padding:8px 4px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:600}.tabs button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px #0001}
.pbody{overflow:auto;padding:0 14px 16px;flex:1}
.lbl{font-size:12px;color:var(--mut);margin:14px 0 6px;font-weight:600}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mode{border:1.5px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;font-size:12px}
.mode b{display:block;font-size:13px}.mode span{color:var(--mut);font-size:11px}.mode.on{border-color:var(--acc);background:var(--acc2)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}.seg button{flex:1;border:0;background:none;padding:6px 4px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mut);font-size:13px}.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px #0001}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:8px}
.row small{display:block;color:var(--mut);font-size:11px}
.sw{position:relative;width:40px;height:22px;flex:none}.sw input{opacity:0;width:0;height:0}.sw i{position:absolute;inset:0;border-radius:99px;background:#c5cedb;cursor:pointer;transition:.2s}
.sw i:before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+i{background:var(--acc)}.sw input:checked+i:before{transform:translateX(18px)}
.sl{display:flex;align-items:center;gap:8px}.sl input{flex:1}.sl .v{min-width:46px;text-align:right;color:var(--acc);font-weight:600;font-size:12px}
input[type=range]{accent-color:var(--acc)}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px}
.colors{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.colors i{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid var(--line)}.colors i.on{outline:2.5px solid var(--acc);outline-offset:2px}
.voice{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:6px;cursor:pointer}.voice.on{border-color:var(--acc);background:var(--acc2)}
.voice .av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700}.voice .pl{margin-left:auto;border:0;background:var(--acc2);color:var(--acc);border-radius:50%;width:30px;height:30px;cursor:pointer}
.prog{max-width:640px;margin:10px auto;width:100%;padding:0 16px}.prog .card{padding:20px}
.steps .s{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:9px;color:var(--mut)}.steps .s.run{background:var(--acc2);color:var(--fg);font-weight:600}.steps .s.done{color:var(--fg)}
.steps .s i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-style:normal;flex:none}
.steps .s.done i{background:var(--ok);border-color:var(--ok);color:#fff}.steps .s.run i{border-color:var(--acc);border-top-color:transparent;animation:sp 1s linear infinite}.steps .s.failed i{background:var(--err);border-color:var(--err);color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
.pbar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0}.pbar b{display:block;height:100%;background:var(--acc);transition:width .5s}
.note{background:#fff6e0;color:#7a5200;border:1px solid #f2dca0;border-radius:12px;padding:10px 14px;font-size:13px;margin-top:12px}
:root[data-theme=dark] .note{background:#2a2312;color:#e9c46a;border-color:#4a3c18}
details{margin-top:12px}details pre{background:var(--bg);border-radius:10px;padding:10px;max-height:240px;overflow:auto;font-size:11px;white-space:pre-wrap}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding:0 22px 22px}
.lc{cursor:pointer;overflow:hidden}.lc .th{aspect-ratio:3/4;background:var(--stage) center/cover;display:grid;place-items:center;color:var(--mut);font-size:26px}.lc .m{padding:10px 12px}.lc .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--acc2);color:var(--acc)}.st.done{background:#e3f6eb;color:var(--ok)}.st.failed{background:#fde8e8;color:var(--err)}
.set{display:grid;grid-template-columns:220px 1fr;gap:18px;padding:0 22px 22px;max-width:1100px}.set .menu{padding:8px;align-self:start}.set .menu a{display:block;padding:9px 12px;border-radius:9px;cursor:pointer}.set .menu a.on{background:var(--acc2);color:var(--acc);font-weight:600}
.set .body{padding:20px 22px}.set h2{margin:0 0 2px;font-size:17px}.set .d{color:var(--mut);margin:0 0 14px;font-size:13px}
.kbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}.tag{font-size:11px;border-radius:6px;padding:1px 7px;background:var(--acc2);color:var(--acc);margin-left:6px}.tag.ok{background:#e3f6eb;color:var(--ok)}
.vo{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 22px 22px;max-width:1200px;width:100%;margin:0 auto}@media(max-width:900px){.vo{grid-template-columns:1fr}}
.vo textarea{width:100%;min-height:360px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;resize:vertical}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.vchip{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:99px;padding:6px 6px 6px 14px;cursor:pointer}.vchip.on{border-color:var(--acc);background:var(--acc2);color:var(--acc);font-weight:600}
.vchip button{border:0;background:none;color:var(--acc);cursor:pointer}
.res{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:0 22px 22px}@media(max-width:1000px){.res{grid-template-columns:1fr}}
.res video{width:100%;max-height:72vh;background:#000;border-radius:14px}.beat{border-top:1px solid var(--line);padding:8px 0}.beat textarea{width:100%;min-height:52px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px}
.warn{color:var(--warn)}.ok{color:var(--ok)}.err{color:var(--err)}.mut{color:var(--mut);font-size:12px}.hide{display:none!important}
.jobs{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}.jobs a{display:block;text-decoration:none;color:var(--fg);font-size:12px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--card)}
.jobs a b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.jobs .pbar{margin:4px 0 0;height:4px}
.kbd{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--mut);margin-left:3px}
#sb a,.note a,.mut a{color:var(--acc);font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#253043;color:#fff;padding:10px 18px;border-radius:12px;z-index:9;font-size:13px}
/* ---------------------------------------------------------------- studio theme v2 (design/new-ui/preview.html) */
:root{--bg:#ecece9;--side:#ecece9;--card:#ffffff;--panel:#f5f5f2;--line:#e2e2dc;--fg:#111111;--ink2:#3a3a38;--mut:#85857f;--acc:#111111;--acc2:#f2f2ee;
 --hl:#d8f14a;--hlfg:#2c3600;--ok:#2f9e57;--warn:#b7800f;--err:#d4463c;--stage:#f5f5f2;--r:26px;
 --sh:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0d0e;--side:#0d0d0e;--card:#19191b;--panel:#202023;--line:#2b2b2f;--fg:#f1f1ee;--ink2:#cfcfca;
 --mut:#8f8f93;--acc:#f1f1ee;--acc2:#232326;--hlfg:#d8f14a;--stage:#141416;--sh:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25)}}
:root[data-theme=dark]{--bg:#0d0d0e;--side:#0d0d0e;--card:#19191b;--panel:#202023;--line:#2b2b2f;--fg:#f1f1ee;--ink2:#cfcfca;
 --mut:#8f8f93;--acc:#f1f1ee;--acc2:#232326;--hlfg:#d8f14a;--stage:#141416;--sh:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25)}
body{background:var(--bg);font-family:"Segoe UI Variable Text","Segoe UI","Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{grid-template-columns:76px 1fr}
/* rail */
aside.rail{background:var(--bg);border:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;overflow:visible;z-index:20}
.rail .logo{padding:0;margin-bottom:16px;display:block}.rail .logo .appicon{width:46px;height:46px;filter:drop-shadow(0 4px 10px rgba(60,50,160,.25))}
.rail nav{display:flex;flex-direction:column;gap:4px}
.rail nav a,.rail #installBtn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--mut);padding:0;position:relative;box-shadow:none;background:none}
.rail nav a svg,.rail #installBtn svg{width:22px;height:22px}
.rail nav a:hover{background:var(--card);color:var(--fg)}
.rail nav a.on{background:var(--card);color:var(--fg);box-shadow:var(--sh)}
.rail nav a.on:before{content:"";position:absolute;left:-14px;top:14px;bottom:14px;width:4px;border-radius:4px;background:var(--fg)}
.tip{position:absolute;left:60px;top:50%;transform:translateY(-50%);background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:30}
.rail a:hover .tip,.rail .ring:hover .tip,.rail .foot:hover .tip{opacity:1}
.rail .sp{flex:1}
.rail .jobs{display:flex;flex-direction:column;gap:8px;margin:0 0 6px}
.rail .jobs a.ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;text-decoration:none;color:var(--fg);padding:0;border:0;
 background:conic-gradient(var(--hl) calc(var(--p)*1%),var(--line) 0);box-shadow:none}
.rail .jobs a.ring:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--card)}
.rail .jobs a.ring b{position:relative;z-index:1;font-size:11px;font-weight:700}
.lgbtn{width:40px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:11px;font-weight:700;cursor:pointer;margin:6px 0 4px}
.rail .foot{background:none;border:0;box-shadow:none;padding:6px;position:relative;font-size:12px;cursor:default}
.rail .foot .dot{width:10px;height:10px;margin:0;display:block;background:var(--err)}.rail .foot .dot.on{background:var(--ok)}.rail .foot .dot.half{background:var(--warn)}
.rail .foot .tip{left:34px}
/* page header */
main{padding:0 8px 0 4px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:22px 26px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.top h1{font-size:32px;line-height:1.1;font-weight:650;letter-spacing:-.03em;color:var(--fg);background:none;-webkit-background-clip:initial;background-clip:initial;margin:0}
.top .sub{color:var(--mut);font-size:13.5px;max-width:640px;white-space:normal}
.top>.btn.line:first-child{border-radius:50%;width:40px;height:40px;padding:0;display:grid;place-items:center}
/* cards & controls */
.card,.jobs a,.drop{background:var(--card);border:0;box-shadow:var(--sh);border-radius:var(--r);backdrop-filter:none}
:root[data-theme=dark] .card{border:1px solid var(--line)}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .card{border:1px solid var(--line)}}
.btn,.btn:not(.ghost):not(.line):not(.red){background:var(--fg);color:var(--bg);border-radius:99px;padding:10px 20px;font-weight:650;box-shadow:none;border:0}
.btn{white-space:nowrap;transition:opacity .12s}.btn:not(:disabled):hover{transform:none;box-shadow:none;opacity:.86}
.btn.ghost{background:var(--panel);color:var(--fg)}.btn.line{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.lime{background:var(--hl)!important;color:#2c3600!important}
.btn.red,.btn.danger{background:color-mix(in srgb,var(--err) 12%,transparent)!important;color:var(--err)!important;border:0}
.pill{background:var(--card);border:0;color:var(--fg);box-shadow:var(--sh);padding:5px 14px 7px;line-height:1.7;font-weight:600}
.pill.acc{background:var(--hl);color:#2c3600;box-shadow:none}
.in,.vo textarea,.beat textarea{background:var(--panel);border:1px solid transparent;border-radius:14px}
.in:focus,textarea:focus,select:focus{outline:2px solid var(--fg);outline-offset:-1px;background:var(--card)}
.seg,.tabs{background:var(--panel);border:0;border-radius:99px;padding:4px}
.seg button,.tabs button{border-radius:99px;color:var(--mut);font-weight:600;line-height:1.7;padding:5px 12px 7px}
.seg button.on,.tabs button.on{background:var(--fg);color:var(--bg);box-shadow:none}
.lbl{color:var(--mut);font-weight:600;font-size:12px}
.mode{border:1.5px solid var(--line);border-radius:18px;background:var(--card)}.mode.on{border-color:var(--fg);background:var(--panel)}
.voice{border:1.5px solid var(--line);border-radius:18px}.voice.on{border-color:var(--fg);background:var(--panel)}
.voice .av{background:var(--panel);color:var(--fg)}.voice.on .av{background:var(--hl);color:#2c3600}
.voice .pl{background:var(--fg);color:var(--bg);width:32px;height:32px;font-size:12px}
.vchip{border:1.5px solid var(--line)}.vchip.on{border-color:var(--fg);background:var(--panel);color:var(--fg)}.vchip button{color:var(--fg)}
.row{border:0;border-radius:16px;background:var(--panel)}
.sw i{background:var(--line)}.sw input:checked+i{background:var(--fg)}.sw i:before{background:var(--card)}
input[type=range]{accent-color:var(--fg)}.sl .v{color:var(--fg)}.colors i.on{outline-color:var(--fg)}
.chip,.tag{background:var(--panel);color:var(--fg);border-radius:99px;padding:2px 10px}
.tag.ok,.st.done{background:var(--hl);color:#2c3600}
.st{background:var(--panel);color:var(--fg);border-radius:99px;padding:1px 9px;font-weight:600}
.st.failed{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}.st.running,.st.queued{background:var(--fg);color:var(--bg)}
.pbar{background:var(--panel);height:6px}.pbar b{background:var(--fg)}
.steps .s.run{background:var(--panel)}.steps .s.done i{background:var(--fg);border-color:var(--fg);color:var(--bg)}.steps .s.run i{border-color:var(--fg);border-top-color:transparent}
.stage{background:var(--panel);border-radius:var(--r)}
.drop{border:1.5px dashed var(--line);box-shadow:none;background:var(--card)}.drop.hover{border-color:var(--fg);background:var(--panel)}
.tools .tool b{background:var(--card);color:var(--fg);box-shadow:var(--sh);border-radius:14px}.tools .tool.on b{background:var(--fg);color:var(--bg)}
#sb a,.note a,.mut a{color:var(--fg);text-decoration:underline;text-underline-offset:2px}
.toast{background:var(--fg);color:var(--bg);border-radius:99px;padding:10px 20px;box-shadow:var(--sh)}
.set .menu{background:var(--card)}.set .menu a{border-radius:14px;color:var(--mut)}.set .menu a.on{background:var(--panel);color:var(--fg)}
.kbox{border-radius:18px;border-color:var(--line)}.res video{border-radius:var(--r)}
.note{border-radius:18px}
/* gradient art (home, style picker) */
.art{border-radius:22px;position:relative;overflow:hidden;color:#fff}
.g1{background:radial-gradient(120% 90% at 20% 10%,#ffe08a,#ff9b54 45%,#e2532d)}.g2{background:radial-gradient(120% 90% at 80% 0%,#b7f5c8,#4cc38a 45%,#1f7a55)}
.g3{background:radial-gradient(120% 90% at 10% 0%,#c9d6ff,#7d8cff 45%,#4b3fd1)}.g4{background:radial-gradient(120% 90% at 50% 0%,#f3f3f0,#cfd8dc 50%,#90a4ae)}
.g5{background:radial-gradient(120% 90% at 20% 100%,#ffb3c7,#c86dd7 50%,#5b3a9e)}.g6{background:linear-gradient(135deg,#1b1b1d,#3a3a40)}
.g7{background:radial-gradient(120% 90% at 30% 10%,#c8f5ff,#4fb3d9 50%,#1d5f8a)}
/* home */
.hero{padding:6px 26px 0}.hero h1{font-size:46px;line-height:1.04;letter-spacing:-.04em;margin:0;font-weight:650}
.hero p{color:var(--mut);margin:10px 0 0;font-size:14px}
.wsg{display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:18px;padding:24px 26px 0}
.ws{height:240px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .15s}.ws:hover{transform:translateY(-3px)}
.ws h3{font-size:24px;letter-spacing:-.025em;margin:0}.ws p{margin:6px 0 0;opacity:.9;font-size:13px;max-width:320px}
.ws .go{align-self:flex-start;background:rgba(255,255,255,.92);color:#111;border-radius:99px;padding:8px 16px;font-weight:650;font-size:13px}
.ws .chips{display:flex;gap:6px;flex-wrap:wrap}.ws .chips span{background:rgba(255,255,255,.22);border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:600}
.hg2{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px 26px 0}
.statline{display:flex;gap:30px;align-items:flex-end;margin-top:12px}.num{font-size:40px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:12px 26px 30px}
.rc{cursor:pointer}.rc .th{aspect-ratio:3/4;border-radius:18px;background:var(--panel) center/cover}.rc b{display:block;font-size:13px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.secth{display:flex;align-items:center;padding:28px 26px 0}.secth h2{font-size:20px;letter-spacing:-.02em;margin:0}
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:14px 26px 0}
/* style picker */
.wiz{display:flex;gap:6px;padding:0 26px 18px;flex-wrap:wrap}.wiz span{font-size:12.5px;font-weight:600;padding:5px 14px 7px;line-height:1.7;border-radius:99px;background:var(--panel);color:var(--mut)}
.wiz span.on{background:var(--fg);color:var(--bg)}.wiz span.d{background:var(--hl);color:#2c3600}
.sp2{display:grid;grid-template-columns:1fr 330px;gap:18px;padding:0 26px 30px;align-items:start}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.stc{padding:0;overflow:hidden;cursor:pointer;border:2px solid transparent!important;transition:transform .15s}.stc:hover{transform:translateY(-2px)}.stc.on{border-color:var(--fg)!important}
.stc .art{height:140px;margin:8px;border-radius:20px;display:grid;place-items:center}
.stc .info{padding:6px 18px 18px}.stc .info p{margin:4px 0 8px;color:var(--mut);font-size:12.5px}
.stc .soon{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px}
.stc .check{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--hl);display:grid;place-items:center;font-weight:800;color:#2c3600;font-size:13px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.opt:first-of-type{border-top:0}
.sp2 .seg{flex-wrap:nowrap}.sp2 .seg button{white-space:nowrap;padding:4px 11px 6px;font-size:12.5px}
/* library */
.libbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 26px 16px}.libbar .in{max-width:260px;border-radius:99px;padding:8px 16px}
.libbar .seg{flex:none;flex-wrap:nowrap}.libbar .seg button{white-space:nowrap}.libbar select.in{border-radius:99px}
.lib{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding:0 26px 26px}
.lc{position:relative;border-radius:var(--r);overflow:hidden;transition:transform .15s}.lc:hover{transform:translateY(-2px)}
.lc .th{aspect-ratio:16/10;background-position:center 30%;position:relative;margin:8px 8px 0;border-radius:18px}
.lc .badge{position:absolute;left:8px;bottom:8px;z-index:1;color:#111;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.9)}
.lc .dur{left:auto;right:8px}
.lc .m{padding:10px 14px 14px}.lc .m b{font-size:13.5px;font-weight:600}.lc .m .mut{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.lc .del{position:absolute;top:16px;right:16px;z-index:2;opacity:0;transition:opacity .15s;border:0;border-radius:99px;width:30px;height:30px;cursor:pointer;background:rgba(255,255,255,.92);color:#111;font-size:13px}
.lc:hover .del,.lc .del:focus{opacity:1}.lc .del:hover{background:var(--err);color:#fff}
.lc .chk{position:absolute;top:18px;left:18px;z-index:2;width:18px;height:18px;accent-color:#111;opacity:0}.lib.sel .lc .chk,.lc:hover .chk{opacity:1}
/* downloads */
.dhist{display:flex;flex-direction:column;gap:8px;margin-top:12px}.dh{display:flex;gap:14px;align-items:center;border-radius:18px;padding:8px;background:var(--panel)}
.dh video,.dh img{width:60px;height:80px;object-fit:cover;border-radius:12px;background:var(--stage);flex:none}.dm{min-width:0;flex:1}.dm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.da{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.da .btn{padding:5px 12px;font-size:12px}
@media(max-width:1100px){.wsg,.hg2{grid-template-columns:1fr}.sp2{grid-template-columns:1fr}.app{grid-template-columns:64px 1fr}aside.rail{display:flex}}
/* image assets (design/chatgpt-image-prompts.md) */
.ws{background-size:cover!important;background-position:center right!important}
.ws:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(0,0,0,.42),rgba(0,0,0,.08) 55%,transparent);pointer-events:none}

.stc .art{background-size:cover!important;background-position:center!important}
.rail .ric{display:none;width:30px;height:30px}.rail nav a.on .ric{display:block}.rail nav a.on .lic{display:none}.rail .lic{width:22px;height:22px;color:var(--ink2)}.rail nav a:hover .lic{color:var(--fg)}.rail nav a:focus{outline:none}.rail nav a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.rail nav a:hover .ric{filter:grayscale(.3) opacity(.9)}.rail nav a.on .ric{filter:none;transform:scale(1.08)}
.mode .mic{width:30px;height:30px;display:block;margin-bottom:4px}
.empty{display:flex;flex-direction:column;align-items:center;padding:24px 0;text-align:center}
.empty-art{width:130px;height:130px;object-fit:contain;margin:0 auto 6px;display:block}
.drop .empty-art{width:110px;height:110px}
.chat{display:flex;flex-direction:column;flex:1;min-height:0;max-width:860px;width:100%;margin:0 auto;padding:0 18px 18px}
.cmsgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px 14px;height:calc(100vh - 190px)}
.cm{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.6}.cm.ai{background:var(--card);border:1px solid var(--line);align-self:flex-start}.cm.me{background:var(--acc);color:#fff;align-self:flex-end}
.cm.card{background:var(--card);border:1px solid var(--line);align-self:stretch;max-width:100%;padding:14px}
.cst{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cs{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}.cs span{font-size:22px}.cs small{color:var(--mut)}.cs em{font-size:11px;color:var(--warn);font-style:normal}.cs:hover,.cs.on{border-color:var(--acc);background:var(--acc2)}
.crow{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:10px}
.cbar{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:8px}.cbar textarea{flex:1;border:0;outline:0;background:transparent;resize:none;max-height:160px}
.krow{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}.kin{position:relative;flex:1;min-width:220px}.kin .in{width:100%;padding-right:44px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;font-size:16px;color:var(--mut);padding:4px 8px}.eye:hover{color:var(--fg)}
</style>

<script>

function setFile(f){S.file=f;S.url="";if(S.src&&S.src.startsWith("blob:"))URL.revokeObjectURL(S.src);S.src=URL.createObjectURL(f);S.boxes=[];S.crop=null;Studio()}
function resetSrc(){S.file=null;S.url="";S.src=null;S.boxes=[];S.crop=null;Studio()}
function drawOv(){const ov=$("#ov");if(!ov){bar();return}ov.className="ov"+(S.tool==="blur"||S.tool==="crop"?" draw":"");const c=prefs.cap;
  const capTop=c.position==="top"?10:c.position==="middle"?50:c.position==="custom"?c.pos_pct*100:86;
  ov.innerHTML=S.boxes.map((b,i)=>`<div class="bx ${i===S.sel?"sel":""}" data-i="${i}" style="left:${b.x0*100}%;top:${b.y0*100}%;width:${(b.x1-b.x0)*100}%;height:${(b.y1-b.y0)*100}%;backdrop-filter:blur(${b.strength/3}px);-webkit-backdrop-filter:blur(${b.strength/3}px)">${i===S.sel&&S.tool!=="done"?`<div class="h"></div>`:""}</div>`).join("")
   +((prefs.border||"none")!=="none"?`<div style="position:absolute;inset:0;pointer-events:none;${prefs.border.includes("glow")?`box-shadow:inset 18px 0 30px -10px ${(prefs.glow||["#FF3B5C"])[0]},inset -18px 0 30px -10px ${(prefs.glow||["","#3B7BFF"])[1]};`:""}"></div>${prefs.border.includes("line")?`<div style="position:absolute;inset:3.5%;border:2px solid ${prefs.borderColor||"#FFFFFF"}aa;border-radius:12px;pointer-events:none"></div>`:""}`:"")

  const sel=S.boxes[S.sel];if(sel&&S.tool!=="done"){const p=document.createElement("div");p.className="bxpanel";p.style.top=`calc(${sel.y0*100}% - 44px)`;p.style.left=`${(sel.x0+sel.x1)/2*100}%`;

function ovEvents(){const ov=$("#ov");let drag=null;
  const pt=e=>{const r=ov.getBoundingClientRect();return{x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))}};
  ov.onpointerdown=e=>{if(e.target.closest(".bxpanel"))return;const p=pt(e);ov.setPointerCapture(e.pointerId);
    if(e.target.classList.contains("ch")){drag={k:"capsz",p,w0:prefs.cap.width_pct,s0:prefs.cap.size};return}
    if(e.target.closest("#capb")&&S.tool!=="blur"&&S.tool!=="crop"){drag={k:"cap"};return}
    const bi=e.target.closest(".bx");if(bi&&S.tool!=="crop"){S.sel=+bi.dataset.i;const b=S.boxes[S.sel];drag={k:e.target.classList.contains("h")?"rs":"mv",p,o:{...b}};drawOv();return}
    if(S.tool==="blur"){S.boxes.push({x0:p.x,y0:p.y,x1:p.x,y1:p.y,strength:20});S.sel=S.boxes.length-1;drag={k:"new",p}}
    else if(S.tool==="crop"){S.crop={x0:p.x,y0:p.y,x1:p.x,y1:p.y};drag={k:"crop",p}}else{S.sel=-1;drawOv()}};
  ov.onpointermove=e=>{if(!drag)return;const p=pt(e);
    if(drag.k==="capsz"){const c=prefs.cap;c.width_pct=Math.round(Math.min(1,Math.max(.4,drag.w0+2*(p.x-drag.p.x)))*100)/100;
      c.size=Math.round(Math.min(140,Math.max(24,drag.s0*(1+3*(p.y-drag.p.y)))));save();drawOv();return}
    if(drag.k==="cap"){prefs.cap.position="custom";prefs.cap.pos_pct=Math.min(.97,Math.max(.08,p.y+.02));save();drawOv();return}
    if(drag.k==="new"||drag.k==="crop"){const t=drag.k==="new"?S.boxes[S.sel]:S.crop;Object.assign(t,{x0:Math.min(drag.p.x,p.x),y0:Math.min(drag.p.y,p.y),x1:Math.max(drag.p.x,p.x),y1:Math.max(drag.p.y,p.y)})}
    else{const b=S.boxes[S.sel],o=drag.o,dx=p.x-drag.p.x,dy=p.y-drag.p.y;
      if(drag.k==="mv"){const w=o.x1-o.x0,h=o.y1-o.y0;b.x0=Math.min(1-w,Math.max(0,o.x0+dx));b.y0=Math.min(1-h,Math.max(0,o.y0+dy));b.x1=b.x0+w;b.y1=b.y0+h}
      else{b.x1=Math.min(1,Math.max(o.x0+.02,o.x1+dx));b.y1=Math.min(1,Math.max(o.y0+.02,o.y1+dy))}}
    drawOv()};
  ov.onpointerup=()=>{if(drag&&drag.k==="new"){const b=S.boxes[S.sel];if(b.x1-b.x0<.015||b.y1-b.y0<.015){S.boxes.pop();S.sel=-1}}
    if(drag&&drag.k==="crop"&&S.crop&&(S.crop.x1-S.crop.x0<.05||S.crop.y1-S.crop.y0<.05))S.crop=null;
    const was=drag;drag=null;if(was){drawOv();if(was.k!=="cap"||S.tab==="captions")panel()}};
  ov.onwheel=e=>{if(!e.target.closest("#capb"))return;e.preventDefault();const c=prefs.cap;c.size=Math.min(140,Math.max(24,c.size+(e.deltaY<0?2:-2)));save();drawOv();if(S.tab==="captions")panel()}}

  $$(".eye").forEach(b=>b.onclick=()=>{const i=$("#k_"+b.dataset.eye);const show=i.type==="password";i.type=show?"text":"password";b.textContent=show?"🙈":"👁"});
  $$("[data-save]").forEach(x=>x.onclick=async()=>{const n=x.dataset.save,v=$("#k_"+n).value.trim(),r=$("#kr_"+(n==="anthropic_base_url"?"anthropic":n));
   if(!v&&n!=="anthropic_base_url"){r.innerHTML='<span class="err">✕ Nothing to save — paste a key first</span>';return}
   if(n==="anthropic_base_url"&&v&&!/^https?:\/\/[^\s]+$/.test(v)){r.innerHTML='<span class="err">✕ The URL must start with https://</span>';return}
   try{await api("/api/keys",J("PUT",{[n]:v}));PROV=null;await loadProv();toast(n==="anthropic_base_url"&&!v?"Base URL removed":"Saved");setBody()}catch(e){r.innerHTML=`<span class="err">✕ ${esc(e.message)}</span>`}});
  $$("[data-clr]").forEach(x=>x.onclick=async()=>{if(!confirm("Remove this saved key?"))return;await api("/api/keys",J("PUT",{[x.dataset.clr]:""}));if(E.mode==="cloud")await api("/api/engine",J("PUT",{mode:"local"})).catch(()=>{});setBody()});
  $$("[data-test]").forEach(x=>x.onclick=async()=>{const n=x.dataset.test,r=$("#kr_"+n),typed=$("#k_"+n).value.trim(),base=n==="anthropic"?$("#k_anthropic_base_url").value.trim():"";
   r.textContent=typed?"Testing the key you typed (not saved yet)…":"Testing the saved key…";
   const res=await api("/api/keys/test",J("POST",{name:n,value:typed,base})).catch(e=>({ok:false,message:e.message}));
   r.innerHTML=`<span class="${res.ok?"ok":"err"}">${res.ok?"✓":"✕"} ${esc(res.message)}</span>${res.ok&&typed?' <small class="mut">— press Save to keep it</small>':""}`});
  $("#eSave").onclick=async()=>{await api("/api/engine",J("PUT",{llm:$("#eLlm").value.trim(),vision:$("#eVis").value.trim()}));toast("Model သိမ်းပြီး")};
  $("#eLoad").onclick=async()=>{$("#eList").textContent="ယူနေပါတယ်…";try{const L=await api("/api/openrouter/models");$("#orList").innerHTML=L.map(m=>`<option value="${esc(m.id)}">`).join("");
   const g=L.filter(m=>/gemini|gpt|claude|qwen|deepseek|llama/i.test(m.id)).slice(0,80);$("#eList").innerHTML=`<table style="width:100%;font-size:12px">${g.map(m=>`<tr style="cursor:pointer" data-id="${esc(m.id)}"><td>${esc(m.id)} ${m.vision?"🖼":""}</td><td style="text-align:right">$${m.in} / $${m.out}</td></tr>`).join("")}</table><div>ဈေး = input / output, 1M token ကို $ · နှိပ်ရင် Script model အဖြစ် ရွေးပါတယ်</div>`;
   $$("#eList tr").forEach(r=>r.onclick=()=>{$("#eLlm").value=r.dataset.id})}catch(e){$("#eList").innerHTML=`<span class="err">${esc(e.message)}</span>`}}}
 else{const h=await api("/api/health").catch(()=>({}));b.innerHTML=`<h2>Videos folder</h2><p class="d">ထုတ်ပြီးသား mp4 / srt တွေ ဒီ folder ထဲမှာ ရှိပါတယ်</p><div class="row"><code style="font-size:12px">${esc(h.projects_root||"")}</code></div><p class="mut">Library ထဲက project ကို ဖွင့်ပြီး 📂 Folder နှိပ်ရင် Explorer နဲ့ ပွင့်ပါတယ်။</p>`}}
// ------------------------------------------------------------ boot
let installPrompt=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;$("#installBtn").classList.remove("hide")});
$("#installBtn").onclick=()=>installPrompt&&installPrompt.prompt();
async function foot(){try{const[h,w]=await Promise.all([api("/api/health"),api("/api/workers")]);const busy=w.workers.filter(x=>x.busy).length;
 window.SYS={h,w,busy};$("#foot").innerHTML=`<span class="dot ${h.ollama&&h.nvenc?"on":h.ollama||h.nvenc?"half":""}"></span><span class="tip">Ollama ${h.ollama?"✓":"✕"} · GPU ${h.nvenc?"✓":"✕"} · Worker ${busy}/${w.max_workers} · တန်းစီ ${w.queued.length}</span>`}catch(e){$("#foot").innerHTML=`<span class="dot"></span><span class="tip">Server မချိတ်မိပါ</span>`}}
addEventListener("keydown",e=>{if(!location.hash.match(/studio|^$/)&&location.hash!=="")return;if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
 const k=e.key.toLowerCase(),m={b:"blur",e:"edit",c:"crop",d:"done"};const v=$("#vid");
 if(m[k]&&v){S.tool=m[k];if(k==="d")S.sel=-1;$$(".tools .tool").forEach(x=>x.classList.toggle("on",x.dataset.k===S.tool));drawOv()}
 else if((k==="delete"||k==="backspace")&&S.sel>=0){S.boxes.splice(S.sel,1);S.sel=-1;drawOv();panel()}
 else if(k===" "&&v){e.preventDefault();v.paused?v.play():v.pause()}});
async function jobsBox(){const l=await api("/api/projects").catch(()=>[]);const run=l.filter(p=>p.job&&(p.job.state==="running"||p.job.state==="queued"));
 $("#jobs").innerHTML=run.slice(0,4).map(p=>{const pc=Math.round(p.job.progress*100);return `<a href="#/project/${p.project_id}" class="ring" style="--p:${pc}"><b>${p.job.state==="queued"?"…":pc}</b><span class="tip">${esc(cleanTitle(p.title||p.project_id).t.slice(0,40))} · ${p.job.state==="queued"?"တန်းစီ":esc(STEP_MY[p.job.stage]||p.job.stage)} · ${pc}%</span></a>`}).join("")}
jobsBox();setInterval(()=>!document.hidden&&jobsBox(),3000);
foot();setInterval(()=>!document.hidden&&foot(),5000);Promise.all([loadProv().catch(()=>{}),initI18n()]).finally(route);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
