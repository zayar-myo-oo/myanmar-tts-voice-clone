[package]
name = "myanmar-voice-studio"
version = "0.1.0"
description = "Offline-first Myanmar AI Voice Studio"
edition = "2021"
license = "MIT"

[lib]
name = "mvs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
